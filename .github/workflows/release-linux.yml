name: Release Linux

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag (e.g., v1.0.0)'
                required: true
                type: string

jobs:
    build-linux:
        permissions:
            contents: write
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4

            - name: setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Rust cache
              uses: swatinem/rust-cache@v2

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install frontend dependencies
              run: |
                echo "📦 Installing frontend dependencies (clean)..."
                rm -rf node_modules
                bun install --force
                echo "✅ Bun install completed"
              working-directory: ./desktop

            - name: Install Linux-specific Tauri CLI binary
              run: |
                echo "🔧 Installing Linux-specific Tauri CLI binary..."
                bun add -D @tauri-apps/cli-linux-x64-gnu
                echo "✅ Platform-specific Tauri CLI installed"
                
                # Verify installation
                if [ -f "node_modules/@tauri-apps/cli-linux-x64-gnu/cli.linux-x64-gnu.node" ]; then
                    echo "✅ Linux Tauri CLI binary verified"
                    ls -la node_modules/@tauri-apps/cli-linux-x64-gnu/
                else
                    echo "❌ Linux Tauri CLI binary still missing after manual install"
                    ls -la node_modules/@tauri-apps/cli*/
                fi
              working-directory: ./desktop

            - name: Prepare Vulkan SDK for Ubuntu 22.04
              run: |
                wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
                sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
                sudo apt update
                sudo apt install vulkan-sdk -y
                sudo apt-get install -y mesa-vulkan-drivers

            - name: Run pre_build.js
              run: bun scripts/pre_build.js --vulkan

            - name: Build
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  tagName: ${{ inputs.tag }}
                  releaseName: "${{ inputs.tag }}"
                  releaseBody: "Linux release for ${{ inputs.tag }} 🐧"
                  prerelease: true
                  args: '--features "vulkan,server" --bundles deb,rpm,appimage'
                  projectPath: "./desktop"
                  tauriScript: bunx tauri
                  beforeBuildCommand: "npm run build"