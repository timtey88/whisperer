name: Release Orchestrator

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag (e.g., v1.0.0)'
                required: true
                type: string
            platforms:
                description: 'Platforms to build (comma-separated: linux,macos-intel,macos-silicon,windows,all)'
                required: true
                default: 'all'
                type: string

jobs:
    trigger-builds:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Linux Build
              if: contains(github.event.inputs.platforms, 'linux') || github.event.inputs.platforms == 'all'
              uses: actions/github-script@v7
              with:
                script: |
                  github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'release-linux.yml',
                    ref: context.ref,
                    inputs: {
                      tag: '${{ github.event.inputs.tag }}'
                    }
                  });

            - name: Trigger macOS Intel Build
              if: contains(github.event.inputs.platforms, 'macos-intel') || github.event.inputs.platforms == 'all'
              uses: actions/github-script@v7
              with:
                script: |
                  github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'release-macos-intel.yml',
                    ref: context.ref,
                    inputs: {
                      tag: '${{ github.event.inputs.tag }}'
                    }
                  });

            - name: Trigger macOS Silicon Build
              if: contains(github.event.inputs.platforms, 'macos-silicon') || github.event.inputs.platforms == 'all'
              uses: actions/github-script@v7
              with:
                script: |
                  github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'release-macos-silicon.yml',
                    ref: context.ref,
                    inputs: {
                      tag: '${{ github.event.inputs.tag }}'
                    }
                  });

            - name: Trigger Windows Build
              if: contains(github.event.inputs.platforms, 'windows') || github.event.inputs.platforms == 'all'
              uses: actions/github-script@v7
              with:
                script: |
                  github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'release-windows.yml',
                    ref: context.ref,
                    inputs: {
                      tag: '${{ github.event.inputs.tag }}'
                    }
                  });
